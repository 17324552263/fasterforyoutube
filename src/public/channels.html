<html>
  <head>
    <meta charset="UTF-8">
    <style>
      body {
        margin: auto;
        width: 420px;
        max-width: 100%;
        font-size: 14px;
        line-height: 1.5;
        background-color: #292a2d;
        color: #E8EAED;
      }

      hr {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        margin: 0;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        user-select: none;
        margin: 12px 8px;
        font-size: 24px;
      }

      header p {
        margin: 0px 10px;
        text-align: center
      }

      header img {
        padding: 8px;
      }

      #content {
        padding: 10px;
      }

      #content > div {
        flex-direction: column;
      }

      #nochannels {
        text-align: center;
        color: rgba(232, 234, 237, 0.75);
        padding: 8px;
      }

      .imageTutorial {
        margin: auto;
        padding: 8px;
      }
      .imageTutorial img {
        border-radius: 6px;
        opacity: 0.85;
      }

      .channel-detail {
        display: grid;
        grid-template-columns: 1fr 44px 60px 80px;
        align-items: center;
        cursor: default;
        padding: 6px 2px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .channel-author {
        min-width: 0;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
      }

      span.channel-author:hover {
        cursor: pointer;
        text-decoration: underline;
      }

      .channel-videos,
      .channel-video-count {
        text-align: center;
      }

      .channel-video-count {
        color: rgba(232, 234, 237, 0.75);
      }

      .channel-rates {
        text-align: center;
      }

      .channel-saved,
      .time-saved {
        text-align: right;
      }

      .time-saved {
        color: rgba(232, 234, 237, 0.75);
      }

      @keyframes flash {
        0%   { color: #fff; background-color: rgba(255, 255, 255, 0.15); }
        100% { color: rgba(232, 234, 237, 0.75); background-color: transparent; }
      }

      .flash {
        animation: flash 1s ease-out;
        border-radius: 3px;
      }

      div#headers {
        margin-bottom: 4px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .clickable {
        cursor: pointer;
        text-decoration: underline;
      }

      #channel-summary {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 10px;
        margin-bottom: 8px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 6px;
      }

      .emphasis {
        font-weight: bold;
        font-size: 118%;
      }

      #hourCount {
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }

      #charts {
        margin-bottom: 12px;
      }

      .chart-section {
        margin-bottom: 12px;
      }

      .chart-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: rgba(232, 234, 237, 0.4);
        margin-bottom: 6px;
        user-select: none;
      }

      .chart-empty {
        font-size: 12px;
        color: rgba(232, 234, 237, 0.35);
        text-align: center;
        padding: 8px 0 4px;
      }

      canvas {
        display: block;
      }

      #heatmap {
        margin: 0 auto;
      }

      #heatmap-info {
        font-size: 11px;
        color: rgba(232, 234, 237, 0.6);
        text-align: center;
        min-height: 16px;
        margin-top: 4px;
        user-select: none;
      }

      #milestones-section {
        margin-bottom: 16px;
      }

      .milestone-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 6px;
      }

      .milestone-card {
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.04);
        min-width: 0;
      }

      .milestone-card.locked {
        opacity: 0.35;
      }

      .milestone-card-header {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 3px;
      }

      .milestone-card-icon {
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .milestone-card-icon svg {
        width: 100%;
        height: 100%;
      }

      .milestone-card-cat {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: rgba(232, 234, 237, 0.4);
      }

      .milestone-card-label {
        font-size: 12px;
        font-weight: bold;
      }

      .milestone-card-desc {
        font-size: 11px;
        color: rgba(232, 234, 237, 0.55);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .milestone-card.earned {
        border-left: 3px solid transparent;
        padding-left: 7px;
      }

      .milestone-all-link {
        text-align: right;
        font-size: 11px;
        margin-top: 2px;
      }

      .milestone-all-link a {
        color: rgba(232, 234, 237, 0.45);
      }

      .milestone-all-link a:hover {
        color: rgba(232, 234, 237, 0.8);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="../assets/faster.128.png" width="40" height="40" />
      <p>Faster for YouTube</p>
    </header>
    <hr>
    <div id="content">
      <div id="nochannels">
        Head to YouTube and set your first speed to get started.<br/><br/>
        Speed buttons appear near the Play button on your videos.<br/>
        <span class="imageTutorial">
          <img src="../assets/speed_controls.png" width="300" height="40" />
        </span>
        Return here to track time saved per channel.
      </div>
      <div id="channel-results">
        <div id="channel-summary">
          <span>You've saved <span id="hourCount" class="emphasis"></span> with Faster</span>
          <span>playing <span id="videoCount" class="emphasis"></span> videos <span id="averageSpeed" class="emphasis"></span>x faster across <span id="channelCount" class="emphasis"></span> channels.</span>
        </div>
        <div id="milestones-section">
          <div class="chart-title">Milestones</div>
        </div>
        <div id="charts">
          <div class="chart-section">
            <div class="chart-title">Watching activity</div>
            <canvas id="heatmap"></canvas>
            <div id="heatmap-info"></div>
          </div>
        </div>
        <div id="channels"></div>
      </div>
    </div>
    <script src="utils.js"></script>
    <script src="milestones.js"></script>
    <script src="channels.js"></script>
  </body>
</html>
