<html>
  <head>
    <meta charset="UTF-8">
    <style>
      html, body {
        height: 300px;
      }

      body {
        margin: auto;
        width: 374px;
        max-width: 100%;
        font-size: 14px;
        line-height: 1.5;
        background-color: #292a2d;
        color: #E8EAED;
      }

      hr {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        margin: 0;
      }

      hr.popup {
        margin-top: 16px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        user-select: none;
        margin: 12px 20px;
        font-size: 24px;
      }

      header p {
        margin: 0px 10px;
        text-align: center
      }

      header img {
        padding: 8px;
      }

      #content {
        padding: 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
      }

      .section {
        min-height: 40px;
        padding: 10px 8px;
        display: flex;
        align-items: center;
        flex-direction: column;
        justify-content: center;
      }

      .emphasis {
        font-weight: bold;
        font-size: 118%;
      }

      #allHourCount {
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }

      a {
        color: #8ab4f8;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      fieldset {
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        padding: 6px 12px;
      }

      #nodata {
        height: auto;
        text-align: center;
        color: rgba(232, 234, 237, 0.75);
      }

      .imageTutorial {
        margin: auto;
        padding: 8px;
      }
      .imageTutorial img {
        border-radius: 6px;
        opacity: 0.85;
      }

      #channelStatistics {
        display: none;
      }

      #help {
        cursor: pointer;
        text-align: center;
        color: rgba(232, 234, 237, 0.6);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="../assets/faster.128.png" width="40" height="40" />
      <p>Faster for YouTube</p>
    </header>
    <hr id="headerRule">
    <div id="content">
      <div class="section" id="nodata">
        Head to YouTube and set your first speed to get started.<br/><br/>
        Speed buttons appear near the Play button on your videos.<br/>
        <span class="imageTutorial">
          <img src="../assets/speed_controls.png" width="300" height="40" />
        </span>
        Return here to track time saved per channel.
      </div>
      <div class="section" id="channelStatistics">
        <fieldset>
          <legend><span id="channelName" class="emphasis"></span></legend>
          <span>
            Watched <span id="channelVideoCount" class="emphasis"></span>
            videos, saving <span id="channelHourCount" class="emphasis"></span>.
          </span>
        </fieldset>
      </div>
      <div class="section" id="statisticsOverview">
        <span>Time saved with Faster: <span id="allHourCount" class="emphasis"></span></span>
        <span id="allStatisticsLink"></span>
      </div>
      <div class="section">
        <span id="help">
          Have a question or feedback?
          <br/>
          <a href="https://chrome.google.com/webstore/detail/faster-for-youtube/efbbmeojmlmbelbcfgcjpijfjeeleidh"
            target="_blank">Share Feedback</a>
        </span>
      </div>
    </div>
    <script src="utils.js"></script>
    <script src="index.js"></script>
  </body>
</html>
